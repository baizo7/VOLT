services:
  - type: web
    name: volt-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python setup.py bdist_wheel
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ROUTES_FILE
        value: routes.json
      - key: MAX_STORED_CHARS
        value: "200000"
      - key: VOLT_ADMIN_KEY
        sync: false
      - key: OBSERVER_ADMIN_KEY
        sync: false

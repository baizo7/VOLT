[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-observer"
version = "1.0.0"
description = "Transparent LLM capture proxy, telemetry observer, and developer CLI"
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
server = [
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.6.0",
    "pgvector>=0.2.5"
]

[project.scripts]
observer = "cli.main:main"

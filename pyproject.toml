[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "volt-ai"
version = "1.0.0"
description = "VOLT-AI: Autonomous Multi-Model AI Coordination, Routing, and Observability Engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "S Sanjai (Baizo)" }
]
license = "Apache-2.0"
keywords = ["ai", "llm", "orchestration", "multi-model", "deepseek", "gemini", "code-generator", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/baizo7/VOLT"
Repository = "https://github.com/baizo7/VOLT.git"
Issues = "https://github.com/baizo7/VOLT/issues"

[project.optional-dependencies]
server = [
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.6.0",
    "pgvector>=0.2.5",
    "slowapi>=0.1.9"
]

[project.scripts]
volt = "cli.main:main"
volt-ai = "cli.main:main"
volt-coder = "cli.main:main_coder"
observer = "cli.main:main"
observer-coder = "cli.main:main_coder"
